[project]
name = "tomarr"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "tomli-w>=1.2.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "alembic>=1.20.1",
    "aiosqlite>=0.22.1",
    "python-multipart>=0.0.33",
    "pwdlib[argon2]>=0.3.1",
    "itsdangerous>=2.2.0",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-recording>=0.14.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "T20", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "No Any. Use object or a Protocol and narrow it (code-standards.md)."
"typing_extensions.Any".msg = "No Any. Use object or a Protocol and narrow it (code-standards.md)."
"httpx2.AsyncClient".msg = "Get clients from HttpClientFactory in core/http.py, so rate limits and the cache apply."

[tool.ruff.lint.per-file-ignores]
"src/tomarr/core/http.py" = ["TID251"]

[tool.pyright]
include = ["src/tomarr", "tests"]
strict = ["src/tomarr"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--block-network", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
