# Hand-written names for the markers the raw files lack: Korean, Chinese and
# Japanese suffixes and a Chapter range stated under its Volume. They prove the
# parser reads the documented shapes, not that indexers use them. Every entry
# here carries `synthetic: true`, and no entry anywhere else may.
# Format: see tests/parser/test_release_corpus.py.

# Korean: 권 (volume), 화 (chapter)
- name: "[Mangaline] Dandadan 3권 [KOR / CBZ]"
  synthetic: true
  title: "Dandadan"
  volumes: [3]
  group: "Mangaline"
  language: kor
  file_format: cbz
- name: "Solo Leveling 나 혼자만 레벨업 1-14권 (Digital) [KOR / ZIP]"
  synthetic: true
  title: "Solo Leveling 나 혼자만 레벨업"
  volumes: ["1-14"]
  source: digital
  language: kor
  file_format: zip
- name: "Tower of God 신의 탑 12화 [KOR / CBZ]"
  synthetic: true
  title: "Tower of God 신의 탑"
  chapters: [12]
  language: kor
  file_format: cbz
- name: "[Aqua Scans] Omniscient Reader 전지적 독자 시점 100-120화 (Webtoon)"
  synthetic: true
  title: "Omniscient Reader 전지적 독자 시점"
  chapters: ["100-120"]
  group: "Aqua Scans"
  hints: [webtoon]

